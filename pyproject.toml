[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amp-screen"
version = "1.12.2"
description = "High-Throughput AlphaFold & Biophysics-Grounded Protein-Peptide Virtual Screening, 7-Ray PSP Multi-Pocket Blind Docking, Physics Engine, & In Silico Lead Optimizer"
readme = "README.md"
authors = [{ name = "Ankur Singh" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "gemmi>=0.6.5",
    "rdkit>=2023.09.1",
    "scikit-learn>=1.3.0",
    "biopython>=1.81",
    "torch>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "PeptideBuilder>=0.1.1",
    "tqdm>=4.65.0",
    "joblib>=1.3.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
relaxation = [
    "openbabel-wheel>=3.1.1.20"
]
legacy = [
    "meeko>=0.5.0"
]
all = [
    "openbabel-wheel>=3.1.1.20",
    "meeko>=0.5.0"
]

[project.scripts]
amp-screen = "amp_screen.cli:main"
af-amp-screen = "amp_screen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
markers = [
    "end_to_end: marks tests as end-to-end integration tests"
]

[tool.setuptools.package-data]
amp_screen = ["data/*"]

