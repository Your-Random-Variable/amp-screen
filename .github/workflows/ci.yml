name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openbabel python3-openbabel

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest wheel
        pip install -e ".[all]"

    - name: Build Wheel Package and Validate Runtime Assets
      run: |
        python -m pip wheel --no-deps --no-build-isolation . -w dist/
        ls -lh dist/
        python -c "from pathlib import Path; import zipfile; z = zipfile.ZipFile(list(Path('dist').glob('*.whl'))[0]); assert any('trained_complex_ensemble.joblib' in name for name in z.namelist()), 'Wheel missing model!'; print('✔ Wheel contains trained model and datasets.')"

    - name: Run Standardized Co-Crystal Benchmarks
      run: |
        python run_benchmarks.py

    - name: Run Full Automated Test Suite
      run: |
        pytest tests/
