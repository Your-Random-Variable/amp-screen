name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openbabel python3-openbabel

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest
        pip install -e .

    - name: Run Standardized Co-Crystal Benchmarks
      run: |
        python run_benchmarks.py

    - name: Run Full Automated Test Suite
      run: |
        pytest tests/
