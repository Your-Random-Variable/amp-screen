name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y openbabel python3-openbabel

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest wheel
        pip install -e ".[all]"

    - name: Build Wheel Package and Validate Isolated Clean Installation
      run: |
        python -m pip wheel --no-deps --no-build-isolation . -w dist/
        ls -lh dist/
        python scripts/verify_wheel.py dist/*.whl

    - name: Run Standardized Co-Crystal Calibration Benchmarks
      run: |
        python run_benchmarks.py

    - name: Run Prospective Blind External Benchmarks (N=52 across 3 Cohorts)
      run: |
        python run_external_benchmark.py

    - name: Run Full Automated Test Suite
      run: |
        pytest tests/
